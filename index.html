<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Correspondence | Signal Monitor</title>
<style>
:root{color-scheme:dark;--ink:#e6b76d;--bright:#ffe1a5;--dim:#8e7147;--line:#44331c;--bg:#090806}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:13px 'Courier New',monospace}main{width:min(760px,94vw);padding:24px 0}header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}h1{font-size:16px;font-weight:normal;letter-spacing:.19em;margin:0}small{color:var(--dim);letter-spacing:.08em}.screen{position:relative;border:1px solid var(--line);background:#0c0a06;padding:8px;box-shadow:0 0 24px #c88b2210}.screen:after{content:'';position:absolute;inset:8px;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#dca34b09 3px 4px)}canvas{display:block;width:100%;height:auto;aspect-ratio:2.4;background:#0b0905}.controls{display:flex;align-items:center;gap:14px;margin:15px 0 8px}button{font:inherit;color:var(--bright);background:#171109;border:1px solid var(--line);padding:9px 14px;cursor:pointer;min-width:88px}button:hover,button:focus-visible{border-color:var(--ink)}input[type=range]{flex:1;min-width:0;accent-color:var(--ink);cursor:pointer}input:disabled{cursor:wait;opacity:.5}#clock{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11px}.status{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;letter-spacing:.08em;gap:8px}#captions{min-height:5em;margin:24px 0 12px;text-align:center;line-height:1.65;color:var(--bright);font-size:clamp(13px,2.5vw,16px);overflow-wrap:anywhere}footer{text-align:center;border-top:1px solid var(--line);padding-top:15px}a{color:var(--ink);text-decoration:none}a:hover{text-decoration:underline}@media(max-width:480px){header{flex-wrap:wrap}.controls{gap:8px}button{min-width:65px;padding:8px}#clock{font-size:10px}}
</style>
</head>
<body><main>
<header><h1>CORRESPONDENCE</h1><small>DETERMINISTIC SIGNAL / 01</small></header>
<div class="screen"><canvas id="scope" width="1200" height="500" aria-label="Audio waveform and thresholded pulse trace"></canvas></div>
<div class="controls"><button id="play" type="button">PLAY</button><input id="seek" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="Playback position"><span id="clock">00:00 / 00:00</span></div>
<div class="status"><span id="state">STANDBY</span><span id="substate">LOADING VTT</span></div>
<div id="captions"></div>
<footer><a href="https://standardgalactic.github.io/correspondence/correspondence-spec.pdf" target="_blank" rel="noopener noreferrer">Technical Specification</a></footer>
<audio id="audio" preload="metadata" src="100,000_Zero_Hallucination_Emails_Without_LLMs.mp3"></audio>
</main>
<script>
'use strict';
const audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),state=document.querySelector('#state'),substate=document.querySelector('#substate'),captions=document.querySelector('#captions'),canvas=document.querySelector('#scope'),g=canvas.getContext('2d');
const W=1200,H=500;let context,analyser,samples,dragging=false,pending=null,cues=[];
function fmt(t){if(!Number.isFinite(t))return '00:00';let s=Math.floor(Math.max(0,t));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function init(){if(context)return;context=new (window.AudioContext||window.webkitAudioContext)();analyser=context.createAnalyser();analyser.fftSize=2048;samples=new Float32Array(analyser.fftSize);const source=context.createMediaElementSource(audio);source.connect(analyser);analyser.connect(context.destination)}
play.addEventListener('click',async()=>{try{init();if(context.state==='suspended')await context.resume();if(audio.paused)await audio.play();else audio.pause()}catch(e){state.textContent='PLAYBACK ERROR';console.error(e)}});
audio.addEventListener('play',()=>{play.textContent='PAUSE';state.textContent='RUNNING'});audio.addEventListener('pause',()=>{play.textContent='PLAY';state.textContent='PAUSED'});audio.addEventListener('ended',()=>{play.textContent='REPLAY';state.textContent='COMPLETE'});audio.addEventListener('error',()=>{state.textContent='AUDIO LOAD ERROR'});
function metadata(){if(Number.isFinite(audio.duration)&&audio.duration>0){seek.max=audio.duration;seek.disabled=false;sync()}}audio.addEventListener('loadedmetadata',metadata);audio.addEventListener('durationchange',metadata);
function sync(){const t=dragging?Number(seek.value):pending!==null?pending:audio.currentTime;if(!dragging&&pending===null)seek.value=audio.currentTime;clock.textContent=fmt(t)+' / '+fmt(audio.duration);const cue=cues.find(c=>t>=c.start&&t<c.end);const text=cue?cue.text:'';if(captions.textContent!==text)captions.textContent=text}
function commit(){dragging=false;const t=Number(seek.value);if(!Number.isFinite(audio.duration)||!Number.isFinite(t))return;pending=Math.min(audio.duration,Math.max(0,t));try{audio.currentTime=pending;state.textContent='SEEKING';}catch(e){pending=null;state.textContent='SEEK ERROR';console.error(e)}sync()}
seek.addEventListener('pointerdown',()=>{dragging=true});seek.addEventListener('input',()=>{dragging=true;sync()});seek.addEventListener('change',commit);seek.addEventListener('pointercancel',()=>{dragging=false;sync()});audio.addEventListener('seeked',()=>{const failed=pending!==null&&Math.abs(audio.currentTime-pending)>1;pending=null;state.textContent=failed?'SEEK UNAVAILABLE':audio.paused?'PAUSED':'RUNNING';sync()});audio.addEventListener('timeupdate',sync);
function stamp(s){const p=s.trim().replace(',','.').split(':').map(Number);return p.reduce((a,b)=>a*60+b,0)}
(async()=>{try{const r=await fetch('100,000_Zero_Hallucination_Emails_Without_LLMs.vtt');if(!r.ok)throw Error('HTTP '+r.status);const text=(await r.text()).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');for(const block of text.split(/\n\s*\n/)){const lines=block.trim().split('\n');const i=lines.findIndex(l=>l.includes('-->'));if(i<0)continue;const [a,b]=lines[i].split('-->');const start=stamp(a),end=stamp(b.trim().split(/\s+/)[0]);const raw=lines.slice(i+1).join(' ').replace(/<[^>]*>/g,'');const decoder=document.createElement('textarea');decoder.innerHTML=raw;const text=decoder.value.trim();if(Number.isFinite(start)&&Number.isFinite(end)&&end>start&&text)cues.push({start,end,text})}cues.sort((a,b)=>a.start-b.start);substate.textContent=cues.length?'VTT READY':'VTT EMPTY';sync()}catch(e){substate.textContent='VTT UNAVAILABLE';console.error(e)}})();
function line(x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function draw(){g.fillStyle='#0b0905';g.fillRect(0,0,W,H);g.lineWidth=1;g.strokeStyle='#302719';for(let x=40;x<=1160;x+=56)line(x,28,x,472);for(let y=28;y<=472;y+=37)line(40,y,1160,y);g.strokeStyle='#6a5030';line(40,170,1160,170);line(40,390,1160,390);g.font='15px monospace';g.fillStyle='#927346';g.fillText('CH 01 / ANALOG',48,48);g.fillText('CH 02 / THRESHOLD',48,322);if(analyser&&!audio.paused)analyser.getFloatTimeDomainData(samples);let peak=.05;if(samples&&!audio.paused)for(const v of samples)peak=Math.max(peak,Math.abs(v));g.save();g.beginPath();g.rect(40,55,1120,245);g.clip();g.beginPath();for(let i=0;i<1120;i++){const v=samples&&!audio.paused?samples[Math.floor(i/1120*samples.length)]:0;const y=170-v/peak*105;if(i===0)g.moveTo(40+i,y);else g.lineTo(40+i,y)}g.strokeStyle='#f6c97e';g.lineWidth=2;g.shadowColor='#e9a43b';g.shadowBlur=8;g.stroke();g.restore();g.beginPath();let previous=0;for(let i=0;i<1120;i+=4){const v=samples&&!audio.paused?samples[Math.floor(i/1120*samples.length)]:0;const level=v>peak*.16?1:0;const y=415-level*52;if(i===0)g.moveTo(40,y);else{g.lineTo(40+i,415-previous*52);g.lineTo(40+i,y)}previous=level}g.strokeStyle='#bd914e';g.lineWidth=2;g.stroke();requestAnimationFrame(draw)}
metadata();draw();
</script></body></html>
